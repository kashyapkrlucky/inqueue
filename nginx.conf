# nginx only inherits add_header from a parent context into a location
# block when that location has none of its own — so security-headers.conf
# is included explicitly in every location below rather than left at the
# server level, where it'd silently stop applying to /index.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets (dist/assets/*) are immutable — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # index.html and the PWA files must always be revalidated, or clients
    # can get stuck on a stale app shell pointing at deleted hashed assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
